<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>image slider</title>
</head>
<body>

    <main class="sliderWrapper">

        <section class="sliderImages">

            <img class="active" src="js/images/image-3.jpg" alt="Slide 1">
            <img src="js/images/image-2.jpg" alt="Slide 2">
            <img src="js/images/imag-1.jpg" alt="Slide 3">
            <img src="js/images/image-4.jpg" alt="Slide 4">
            <img src="js/images/image-5.jpg" alt="Slide 5">
            <img src="js/images/image-6.jpg" alt="Slide 6">


        </section>

       <button class="next" id="nextBtn"><i class="fa-solid fa-chevron-right"></i></button>
       <button class="back" id="backBtn"><i class="fa-solid fa-chevron-left"></i></button>


       <section class="dots">
        <button data-index="0"><i class="fa-solid fa-circle"></i></button>
        <button data-index="1"><i class="fa-solid fa-circle"></i></button>
        <button data-index="2"><i class="fa-solid fa-circle"></i></button>
        <button data-index="3"><i class="fa-solid fa-circle"></i></button>
        <button data-index="4"><i class="fa-solid fa-circle"></i></button>
        <button data-index="5"><i class="fa-solid fa-circle"></i></button>
       </section>


    </main>



    <script src="js/index.js"></script>
</body>
</html>
